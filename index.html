<!doctype html>
<html lang="az">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Gitara və piano nəzəriyyəsi: akorlar, qammalar, interaktiv qrif və klaviatura"/>
    <title>Fretwise — Musiqi nəzəriyyəsi</title>
    <script>
        (function () {
            var stored = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
            try {
                var accent = JSON.parse(localStorage.getItem('settings') || '{}').accent;
                if (accent) document.documentElement.dataset.accent = accent;
            } catch (e) {}
        })();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
